services:
  - type: web
    name: salary-prediction
    runtime: python
    buildCommand: pip install -r requirements.txt && python data/generate_dataset.py && python model/train_model.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_DEBUG
        value: false
